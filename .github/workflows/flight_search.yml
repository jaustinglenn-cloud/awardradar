name: AwardRadar Live Flight Search

on:
  schedule:
    - cron: "0 12 * * *" # Runs daily at 12:00 UTC (6:00 AM CST)
  workflow_dispatch:     # On-demand trigger from AwardRadar UI

permissions:
  contents: write

jobs:
  search-awards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 5-Layer Zero-Cost Waterfall Scraper
        env:
          SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python scripts/search_flights.py

      - name: Commit Updated Deals to Repository
        run: |
          git config --global user.name "AwardRadar Bot"
          git config --global user.email "awardradar-bot@users.noreply.github.com"
          git add data/deals.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(deals): update live award flights [skip ci]" && git push)
