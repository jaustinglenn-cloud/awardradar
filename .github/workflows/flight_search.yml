name: AwardRadar Morning Digest & Error Alerter

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  morning-award-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (SerpApi + Camoufox)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m camoufox fetch

      - name: Execute AwardRadar morning digest & ntfy.sh alerter
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python scripts/search_flights.py

      - name: Commit updated data/deals.json back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deals.json
          if git diff --staged --quiet; then
            echo "No changes in data/deals.json"
          else
            git commit -m "chore(deals): morning digest flight & award refresh [skip ci]"
            git push
          fi
